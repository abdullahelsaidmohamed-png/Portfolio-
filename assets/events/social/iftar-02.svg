<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Iftar moments reel</title>
  <desc id="desc">Facebook post preview for Iftar</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".42" stop-color="#1b1f3a"/>
      <stop offset="1" stop-color="#ff6b22"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .kicker{font:800 24px Arial, sans-serif;letter-spacing:8px;fill:#ffb35c}
      .title{font:900 52px Arial, sans-serif;fill:#fff;letter-spacing:-1.5px}
      .meta{font:800 22px Arial, sans-serif;fill:#dfe7f7;letter-spacing:3px}
      .small{font:800 18px Arial, sans-serif;fill:#101827}
      .icon{font:900 90px Arial, sans-serif;fill:#101827}
      .grid{stroke:#fff;stroke-opacity:.08;stroke-width:1}
    </style>
  </defs>
  <rect width="1000" height="700" rx="44" fill="url(#bg)"/>
  <circle cx="825" cy="140" r="210" fill="#ff8b3d" opacity=".20" filter="url(#blur)"/>
  <circle cx="210" cy="620" r="220" fill="#ffffff" opacity=".10" filter="url(#blur)"/>
  <circle cx="534" cy="514" r="28" fill="white" opacity="0.20"/><circle cx="685" cy="611" r="51" fill="white" opacity="0.13"/><circle cx="836" cy="148" r="74" fill="white" opacity="0.24"/><circle cx="167" cy="245" r="97" fill="white" opacity="0.17"/><circle cx="318" cy="342" r="46" fill="white" opacity="0.10"/><circle cx="469" cy="439" r="69" fill="white" opacity="0.21"/><circle cx="620" cy="536" r="92" fill="white" opacity="0.14"/>
  <path d="M0 570 C180 500 270 690 470 610 C650 540 740 430 1000 500 L1000 700 L0 700 Z" fill="#090e1c" opacity=".58"/>
  <g opacity=".75">
    <path class="grid" d="M75 95H925M75 175H925M75 255H925M75 335H925M75 415H925M75 495H925M75 575H925"/>
    <path class="grid" d="M120 55V635M240 55V635M360 55V635M480 55V635M600 55V635M720 55V635M840 55V635"/>
  </g>
  <rect x="64" y="64" width="260" height="48" rx="24" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.22)"/>
  <text x="88" y="96" class="kicker">IFTAR</text>
  <g transform="translate(738 78)">
    <rect width="166" height="166" rx="38" fill="url(#shine)"/>
    <text x="83" y="105" text-anchor="middle" class="icon">☾</text>
    <text x="83" y="140" text-anchor="middle" class="small">REEL</text>
  </g>
  <text x="72" y="246" class="meta">TEAM IFTAR</text>
  <text x="72" y="332" class="title">Iftar moments reel</text>
  <g transform="translate(72 592)">
    <rect width="300" height="54" rx="27" fill="#fff" opacity=".92"/>
    <text x="28" y="35" class="small">OPEN FACEBOOK POST</text>
  </g>
</svg>